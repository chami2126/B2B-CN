<!DOCTYPE html>
<html>
<head>
  <title>SNK Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; margin: 10px 0; border-radius: 8px; }
    button { padding: 10px 15px; background: red; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Welcome to SNK Dashboard</h1>
  
  <div class="card">
    <h3>Total Orders</h3>
    <p>25</p>
  </div>
  
  <div class="card">
    <h3>Pending Messages</h3>
    <p>5</p>
  </div>

  <button onclick="logout()">Logout</button>

  <script>
    // Login Check
    if (localStorage.getItem('loggedIn') !== 'true') {
      window.location.href = '/';
    }

    function logout() {
      localStorage.removeItem('loggedIn');
      window.location.href = '/';
    }
  </script>
</body>
</html>
